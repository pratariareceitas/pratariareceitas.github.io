<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="z2Bx_Cp7F-g1zS4fv22A4hOCkfe8mE2aKKqVLCvOfUQ" /> 
    <title>Receitaê - O Teu Portal de Receitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8C3317;
            --secondary: #D96B43;
            --accent: #F2A950;
            --bg-light: #FAF7F2;
            --text-dark: #2C221E;
            --white: #FFFFFF;
            --shadow: 0 10px 25px rgba(140, 51, 23, 0.08);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin-bottom: 0.5rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }

        .search-filter-container { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2.5rem; align-items: center; }
        .search-bar { width: 100%; max-width: 600px; position: relative; }
        .search-bar input {
            width: 100%; padding: 1rem 1.5rem 1rem 3rem; border-radius: 50px;
            border: 2px solid #E6DCD0; background: var(--white); font-size: 1rem; outline: none;
        }
        .search-bar i { position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--secondary); }

        .categories { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; }
        .cat-btn {
            background: var(--white); border: 2px solid #E6DCD0; padding: 0.6rem 1.2rem;
            border-radius: 30px; cursor: pointer; font-weight: 500; color: var(--text-dark); transition: 0.3s;
        }
        .cat-btn:hover, .cat-btn.active { background: var(--secondary); color: var(--white); border-color: var(--secondary); }

        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .recipe-card {
            background: var(--white); border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow); transition: 0.3s; display: flex; flex-direction: column;
        }
        .recipe-card:hover { transform: translateY(-5px); }
        .recipe-img { height: 200px; width: 100%; object-fit: cover; }
        .recipe-content { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
        .recipe-tag { font-size: 0.75rem; text-transform: uppercase; color: var(--secondary); font-weight: 600; margin-bottom: 0.5rem; }
        .recipe-title { font-family: 'Playfair Display', serif; font-size: 1.35rem; margin-bottom: 0.75rem; }
        .recipe-desc { font-size: 0.9rem; color: #665; margin-bottom: 1.2rem; flex-grow: 1; }
        .recipe-btn {
            background: var(--primary); color: var(--white); border: none; padding: 0.7rem;
            border-radius: 8px; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none;
        }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 1rem; z-index: 1000; }
        .modal-content { background: var(--white); width: 100%; max-width: 700px; max-height: 90vh; border-radius: var(--radius); overflow-y: auto; padding: 2rem; position: relative; }
        .close-modal { position: absolute; top: 1.2rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer; color: var(--primary); }
        .modal-header h2 { font-family: 'Playfair Display', serif; color: var(--primary); font-size: 2rem; }
        .modal-section-title { font-size: 1.2rem; color: var(--secondary); margin: 1.2rem 0 0.5rem; font-weight: 600; border-bottom: 2px solid var(--bg-light); }

        footer { text-align: center; padding: 2.5rem; background: #2C221E; color: var(--white); margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <h1>Receitaê</h1>
        <p>Receitas deliciosas, caseiras e feitas com muito carinho para o teu dia a dia</p>
    </header>

    <div class="container">
        <div class="search-filter-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Procurar receita..." onkeyup="filterRecipes()">
            </div>
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('all', this)">Todas</button>
                <button class="cat-btn" onclick="filterCategory('doces', this)">Doces e Sobremesas</button>
                <button class="cat-btn" onclick="filterCategory('massas', this)">Massas</button>
                <button class="cat-btn" onclick="filterCategory('principais', this)">Pratos Principais</button>
                <button class="cat-btn" onclick="filterCategory('lanches', this)">Lanches Rápidos</button>
                <button class="cat-btn" onclick="filterCategory('entradas', this)">Entradas e Sopas</button>
            </div>
        </div>

        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeRecipeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Receitaê - Projeto GitHub de Receitas</p>
    </footer>

    <!-- Carrega a base de dados de receitas -->
    <script src="receitas.js"></script>

    <script>
        function renderRecipes(recipesToRender) {
            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = "";

            if (recipesToRender.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #777;">Nenhuma receita encontrada.</p>`;
                return;
            }

            recipesToRender.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <img src="${recipe.image}" alt="${recipe.title}" class="recipe-img">
                    <div class="recipe-content">
                        <span class="recipe-tag">${recipe.tag}</span>
                        <h3 class="recipe-title">${recipe.title}</h3>
                        <p class="recipe-desc">${recipe.desc}</p>
                        <button class="recipe-btn" onclick="openRecipeModal(${recipe.id})">Ver Receita Completa</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'all') {
                renderRecipes(recipes);
            } else {
                renderRecipes(recipes.filter(r => r.category === category));
            }
        }

        function filterRecipes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderRecipes(recipes.filter(r => 
                r.title.toLowerCase().includes(query) || 
                r.desc.toLowerCase().includes(query) ||
                r.ingredients.some(ing => ing.toLowerCase().includes(query))
            ));
        }

        function openRecipeModal(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            document.getElementById('modalBody').innerHTML = `
                <div class="modal-header">
                    <span class="recipe-tag">${recipe.tag}</span>
                    <h2>${recipe.title}</h2>
                    <p style="color: #665; margin-bottom: 1rem;">${recipe.desc}</p>
                </div>
                <img src="${recipe.image}" alt="${recipe.title}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem;">
                
                <div class="modal-section-title"><i class="fa-solid fa-basket-shopping"></i> Ingredientes</div>
                <ul>${recipe.ingredients.map(ing => `<li>${ing}</li>`).join('')}</ul>

                <div class="modal-section-title"><i class="fa-solid fa-fire-burner"></i> Modo de Preparo</div>
                <ol>${recipe.prep.map(step => `<li>${step}</li>`).join('')}</ol>

                <div style="background: #FFF3E0; border-left: 4px solid var(--accent); padding: 1rem; border-radius: 8px; margin-top: 1.5rem;">
                    <strong>💡 Dica do Chef:</strong> ${recipe.tip}
                </div>
            `;
            document.getElementById('recipeModal').style.display = 'flex';
        }

        function closeRecipeModal() {
            document.getElementById('recipeModal').style.display = 'none';
        }

        window.onclick = function(e) {
            if (e.target === document.getElementById('recipeModal')) closeRecipeModal();
        }

        // Renderiza as receitas ao carregar
        renderRecipes(recipes);
    </script>
</body>
</html>
